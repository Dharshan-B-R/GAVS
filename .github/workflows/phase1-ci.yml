name: KiranaAI Phase 1 CI

on:
  push:
    branches: [main, phase2-intelligence-completion, phase2-permission-migration-hardening]
  pull_request:
    branches: [main, phase2-intelligence-completion]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kiranaai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kiranaai
      JWT_SECRET_KEY: ci-only-secret-key-change-me-which-is-long-enough-123456789
      GEMINI_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Create isolated test database
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres kiranaai_test
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Verify fresh database bootstrap
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres kiranaai_fresh
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/kiranaai_fresh python backend/scripts/bootstrap_fresh_database.py
          cd backend
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/kiranaai_fresh alembic current
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests -v

  flutter-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: mobile_app
        run: flutter pub get
      - name: Analyze Flutter app
        working-directory: mobile_app
        run: flutter analyze
